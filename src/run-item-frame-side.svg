 <defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e5cb93" stop-opacity=".3"/><stop offset=".45" stop-color="#ead4a6"/><stop offset="1" stop-color="#c4a570" stop-opacity=".3"/></linearGradient></defs>
 <defs>
