<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sunny · Баги и фидбек</title>
<style>
:root{color-scheme:dark;--gold:#cfb57b;--text:#e3e0d9;--muted:#b0a99b;--line:#b6a17a40}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#30291c80,transparent 65%),#0c0b09;color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh}button,input,textarea,select{font:inherit;color:inherit}button,a,input,textarea,select{outline-offset:5px}button{cursor:pointer}button,.button,select,input,textarea{background:#11100de8;border:1px solid var(--line);border-radius:0;transition:border-color .25s ease-in-out,box-shadow .25s ease-in-out,background .25s ease-in-out}button,.button{color:var(--text);padding:11px 20px;text-decoration:none;display:inline-block}button:hover,.button:hover,select:hover,input:hover,textarea:hover,button:focus-visible,.button:focus-visible{border-color:var(--gold);box-shadow:0 0 9px #e7bc6545,0 0 26px #dfb04e30}button:disabled{opacity:.5;cursor:wait}header{padding:35px 24px 18px;text-align:center}header small{color:var(--muted);letter-spacing:.18em}h1{font-size:34px;font-weight:400;letter-spacing:.06em;margin:10px 0 18px}.ornament{display:flex;align-items:center;gap:16px;justify-content:center;color:var(--gold)}.ornament:before,.ornament:after{content:'';width:160px;height:1px;background:linear-gradient(90deg,transparent,#cbb786)}.ornament:after{transform:scaleX(-1)}main{max-width:1440px;margin:auto;padding:0 24px 45px}.tabs{display:flex;justify-content:center;gap:16px;border-bottom:1px solid var(--line);margin-bottom:24px}.tabs button{border:0;border-bottom:2px solid transparent;background:none;font-size:22px;padding:14px 28px}.tabs [aria-selected=true]{border-bottom-color:var(--gold);color:#ead7ab}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}input,select{padding:11px 12px}input[type=search]{flex:1;min-width:180px}option{background:#191712}#status-filter{min-width:160px}.count{color:var(--muted);margin-left:auto}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.column{min-width:0}.column h2{font-size:18px;font-weight:400;color:#cfbd98;border-bottom:1px solid var(--line);padding-bottom:12px;margin:0 0 14px}.column h2 span{color:var(--muted);font-size:14px}.card{display:block;text-align:left;width:100%;padding:15px;margin-bottom:12px;background:#17140f99;overflow-wrap:anywhere}.card .meta{font-size:13px;color:#b9a780;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px}.card .text{white-space:pre-wrap;line-height:1.5}.card footer{font-size:12px;color:var(--muted);margin-top:12px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}.empty{font-size:14px;color:#8f887b;padding:16px 0}.error{color:#eaa58a;margin:12px 0;white-space:pre-wrap}.loading{color:var(--muted)}dialog{background:#100f0d;color:var(--text);border:1px solid #c3a76880;width:min(660px,calc(100% - 28px));max-height:90vh;padding:26px;box-shadow:0 0 45px #d3a64c16}dialog::backdrop{background:#000b;backdrop-filter:blur(5px)}dialog h2{font-size:25px;font-weight:400;margin:0 0 22px}form label{display:block;color:#c5bca9;margin-bottom:16px;font-size:14px}form input,form textarea,form select{display:block;width:100%;margin-top:7px;font-size:16px}textarea{resize:vertical;min-height:145px;padding:12px;line-height:1.5}#comment{min-height:80px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}.primary{border-color:#cdb47880;color:#f1ddad}.help{font-size:13px;color:var(--muted);margin-top:24px;line-height:1.6}#notice{min-height:18px;color:var(--muted);font-size:14px;margin-bottom:12px}@media(max-width:1000px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:580px){.board,.pair{grid-template-columns:1fr}main{padding:0 15px 30px}.toolbar>*{flex-grow:1}.tabs{gap:0}.tabs button{padding:14px 22px}h1{font-size:28px}.count{margin:0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><small>СОЛНЕЧНЫЙ ЗАЙЧИК</small><h1>Баги и фидбек</h1><div class="ornament" aria-hidden="true">◇</div></header>
<main><nav class="tabs" role="tablist" aria-label="Категории"><button role="tab" id="tab-bug" aria-selected="true" aria-controls="board">Баги</button><button role="tab" id="tab-feedback" aria-selected="false" aria-controls="board">Фидбек</button></nav>
<div class="toolbar"><input id="search" type="search" aria-label="Поиск" placeholder="Автор, текст, билд…"><select id="status-filter" aria-label="Фильтр по статусу"><option value="">Все статусы</option value="new">Новое</option><option value="working">В работе</option><option value="review">На проверке</option><option value="closed">Закрыто</option></select><button id="refresh">Обновить</button><button id="add" class="primary">＋ Добавить</button><a class="button" href="/export">Экспорт JSON</a><span class="count" id="count"></span></div>
<div id="notice" role="status" aria-live="polite"></div><div id="error" class="error" role="alert"></div><section id="board" class="board" role="tabpanel" aria-labelledby="tab-bug"></section>
<div class="help">Данные хранятся локально в feedback/data/cards.json. Перед каждым сохранением создаётся резервная копия cards.json.backup.<br>Нажми на карточку, чтобы изменить её текст, комментарий или статус.</div></main>
<dialog id="editor"><form id="form"><h2 id="editor-title">Новая запись</h2><div class="pair"><label>Автор<input id="author" required maxlength="160" autocomplete="off"></label><label>Билд<input id="build" maxlength="160" placeholder="Например, Build-0012"></label></div><div class="pair"><label>Тип<select id="type"><option value="bug">Баг</option><option value="feedback">Отзыв</option><option value="suggestion">Предложение</option></select></label><label>Статус<select id="status"><option value="new">Новое</option><option value="working">В работе</option><option value="review">На проверке</option><option value="closed">Закрыто</option></select></label></div><label>Текст<textarea id="text" required maxlength="30000"></textarea></label><label>Твой комментарий<textarea id="comment" maxlength="30000"></textarea></label><div id="form-error" class="error" role="alert"></div><div class="actions"><button type="button" id="cancel">Назад</button><button type="submit" id="save" class="primary">Сохранить</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id),labels={new:'Новое',working:'В работе',review:'На проверке',closed:'Закрыто'},types={bug:'Баг',feedback:'Отзыв',suggestion:'Предложение'};
let cards=[],tab='bug',editing=null,loaded=false;
function element(tag,text,className){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e;}
function render(){
  const query=$('search').value.trim().toLocaleLowerCase('ru'),status=$('status-filter').value;
  const visible=cards.filter(c=>(tab==='bug'?c.type==='bug':c.type!=='bug')&&(!status||c.status===status)&&[c.author,c.text,c.comment,c.build].some(v=>String(v??'').toLocaleLowerCase('ru').includes(query)));
  $('board').replaceChildren();$('count').textContent=loaded?`${visible.length} записей`:'';
  for(const key of Object.keys(labels)){
    if(status&&status!==key)continue;const column=element('section',undefined,'column'),items=visible.filter(c=>c.status===key),heading=element('h2',labels[key]+' ');heading.append(element('span',String(items.length)));column.append(heading);
    for(const c of items){const card=element('button',undefined,'card');card.type='button';card.setAttribute('aria-label',`${types[c.type]}: ${c.author}. ${c.text.slice(0,120)}. ${labels[c.status]}`);
      const meta=element('div',undefined,'meta');meta.append(element('span',c.author),element('span',types[c.type]));card.append(meta,element('div',c.text.length>450?c.text.slice(0,450)+'…':c.text,'text'));
      const footer=element('footer');footer.append(element('span',c.build||'Билд не указан'),element('span',new Date(c.createdAt).toLocaleDateString('ru')));card.append(footer);if(c.comment)card.append(element('footer','Есть комментарий'));card.onclick=()=>open(c);column.append(card);}
    if(!items.length)column.append(element('div','Пока пусто','empty'));$('board').append(column);
  }
}
function selectTab(next){tab=next;for(const name of ['bug','feedback'])$('tab-'+name).setAttribute('aria-selected',String(name===tab));$('board').setAttribute('aria-labelledby','tab-'+tab);render();}
for(const name of ['bug','feedback']){$('tab-'+name).onclick=()=>selectTab(name);$('tab-'+name).onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const next=tab==='bug'?'feedback':'bug';selectTab(next);$('tab-'+next).focus();}};}
async function refresh(){try{$('refresh').disabled=true;const r=await fetch('/api/cards');const data=await r.json();if(!r.ok)throw Error(data.error);cards=data.cards;loaded=true;$('error').textContent='';render();}catch(e){$('error').textContent='Не удалось загрузить записи: '+e.message;}finally{$('refresh').disabled=false;}}
function open(card=null){editing=card;$('form').reset();for(const key of ['author','build','type','status','text','comment'])$(key).value=card?.[key]??(key==='type'?(tab==='bug'?'bug':'feedback'):key==='status'?'new':'');$('editor-title').textContent=card?'Изменить запись':'Новая запись';$('form-error').textContent='';$('editor').showModal();$('author').focus();}
$('add').onclick=()=>open();$('cancel').onclick=()=>$('editor').close();$('refresh').onclick=refresh;$('search').oninput=render;$('status-filter').onchange=render;
$('form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(['author','build','type','status','text','comment'].map(k=>[k,$(k).value]));if(editing){data.id=editing.id;data.updatedAt=editing.updatedAt;}
  try{$('save').disabled=true;const r=await fetch('/api/cards',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),result=await r.json();if(!r.ok)throw Error(result.error);await refresh();selectTab(result.type==='bug'?'bug':'feedback');$('editor').close();$('notice').textContent='Сохранено';}catch(e){$('form-error').textContent=e.message;}finally{$('save').disabled=false;}};
refresh();
</script></body></html>
