<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="description" content="Preserve the last ray of sunset. A 3D game about a sun bunny in a magical tower." data-i18n-content="Preserve the last ray of sunset. A 3D game about a sun bunny in a magical tower."><script>if(new URL(location.href).searchParams.has('sunny-run'))document.documentElement.classList.add('boot-run');</script><style>html,body,#world{background:#000}html.boot-run{background:#000}html.boot-run body{visibility:hidden}html.boot-run #intro{display:none!important}</style><title data-i18n="Sun Bunny · Tower of the Last Light">Sun Bunny · Tower of the Last Light</title><link rel="stylesheet" href="./src/run-transition.css"><link rel="stylesheet" href="./src/style.css"><link rel="stylesheet" href="./src/gothic-ui.css"><link rel="stylesheet" href="./src/pixel-ui.css"><link rel="stylesheet" href="./src/paper-ui.css"><link rel="stylesheet" href="./src/skill-tree.css"><link rel="stylesheet" href="./src/main-menu.css"><link rel="stylesheet" href="./src/menu-background.css"></head>
<body><div id="menu-background" aria-hidden="true"></div><canvas id="world" aria-label="3D magical tower" data-i18n-aria-label="3D magical tower"></canvas>
<div id="vignette"></div>
<div id="shadow-vfx" aria-hidden="true"></div>

<aside id="intro" class="panel" aria-label="Main menu" data-i18n-aria-label="Main menu"><div class="menu-emblem" aria-hidden="true"></div><h1><span class="title-first" data-i18n="SUN">SUN</span><span data-i18n="BUNNY">BUNNY</span></h1><div class="menu-divider" aria-hidden="true"></div><nav class="menu-actions" aria-label="Actions" data-i18n-aria-label="Actions"><button id="start" class="primary" data-i18n="Start run">Start run</button><button id="intro-settings" class="text-button">Settings</button><button id="intro-bestiary" class="text-button" data-i18n="Bestiary">Bestiary</button><button id="intro-statistics" class="text-button" data-i18n="Statistics">Statistics</button><button id="reset-progress" class="text-button" title="Reset points and learned skills" data-i18n-title="Reset points and learned skills" data-i18n="Reset skill tree · debug">Reset skill tree · debug</button><button id="debug-boss" class="text-button" data-i18n="Boss fight · debug">Boss fight · debug</button><button id="sound" class="text-button" aria-label="Enable sound" data-i18n-aria-label="Enable sound" data-i18n="Sound: off · debug">Sound: off · debug</button></nav></aside>
<section id="hud" hidden><div class="light-stat"><span class="eyebrow" data-i18n="YOUR LIGHT">YOUR LIGHT</span><strong id="light-value">100<small>%</small></strong><div class="light-track"><div id="light-fill"><span class="solar-flow" aria-hidden="true"></span></div><span class="shadow-frame-glow" aria-hidden="true"></span><span class="shadow-band" aria-hidden="true"></span><span class="shadow-threshold" role="img" aria-label="Shadow threshold: 30% Light" data-i18n-aria-label="Shadow threshold: 30% Light" title="Shadow begins below 30% Light" data-i18n-title="Shadow begins below 30% Light"></span><span class="light-track-tail" aria-hidden="true"></span><span id="light-sun" aria-hidden="true"></span></div><span id="effect">In the sunset light</span></div><div class="objective"><small id="shards">Glints: 0</small></div></section>
<div id="tower-descent" role="progressbar" aria-label="Tower descent" data-i18n-aria-label="Tower descent">
  <div class="tower-descent__rail" aria-hidden="true"></div>
  <div class="tower-descent__marks" aria-hidden="true"></div>
  <div class="tower-descent__marker" aria-hidden="true">
    <div class="tower-descent__readout">
      <span class="tower-descent__current-stage"></span>
      <span class="tower-descent__current-floor"></span>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden><div class="modal-card"><div id="modal-kicker" hidden></div><h2 id="modal-title" data-i18n="Pause">Pause</h2><p id="modal-text" hidden></p><div class="menu-divider" aria-hidden="true"></div><nav class="menu-actions" aria-label="Pause menu" data-i18n-aria-label="Pause menu"><button class="primary" id="resume" data-i18n="Resume">Resume</button><button class="text-button" id="restart" data-i18n="Restart run">Restart run</button><button class="text-button" id="main-menu" data-i18n="Return to main menu">Return to main menu</button></nav></div></div>
<footer><div class="controls"><span><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> <span id="movement-mode">along the spiral</span></span><span id="arena-controls" hidden><kbd>W</kbd><kbd>S</kbd> <span data-i18n="around the arena">around the arena</span></span><span><kbd data-i18n="Space">Space</kbd> <span data-i18n="hud.jump">jump</span></span><span><kbd>Shift</kbd> <span id="phase-status">Phasing</span></span><span id="flare-hint" hidden><kbd>E</kbd> <span data-i18n="Flare">Flare</span></span><span><kbd>Esc</kbd> <span data-i18n="hud.pause">pause</span></span></div><div class="chapter"><span>01</span> <b style="font:inherit" data-i18n="SUNCATCHER">SUNCATCHER</b> <i>✦</i></div></footer>
<div id="touch"><div><button data-key="KeyA" aria-label="Left" data-i18n-aria-label="Left">←</button><button data-key="KeyD" aria-label="Right" data-i18n-aria-label="Right">→</button><button data-key="KeyW" class="arena-touch" aria-label="Forward" data-i18n-aria-label="Forward" hidden>↑</button><button data-key="KeyS" class="arena-touch" aria-label="Back" data-i18n-aria-label="Back" hidden>↓</button></div><div><button id="flare-touch" data-key="KeyE" aria-label="Solar Flare" data-i18n-aria-label="Solar Flare" hidden>☀</button><button data-key="ShiftLeft" aria-label="Phasing">✧</button><button data-key="Space" aria-label="Jump" data-i18n-aria-label="Jump">↥</button></div></div>
<script type="module" src="./src/bootstrap.js"></script></body></html>
