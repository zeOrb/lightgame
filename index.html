<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="description" content="Сохрани последний луч заката. Трёхмерная игра о солнечном зайчике в магической башне."><script>if(new URL(location.href).searchParams.has('sunny-run'))document.documentElement.classList.add('boot-run');</script><style>html,body,#world{background:#000}html.boot-run{background:#000}html.boot-run body{visibility:hidden}html.boot-run #intro{display:none!important}</style><title>Солнечный зайчик · Башня последнего света</title><link rel="stylesheet" href="./src/run-transition.css"><link rel="stylesheet" href="./src/style.css"><link rel="stylesheet" href="./src/gothic-ui.css"><link rel="stylesheet" href="./src/pixel-ui.css"><link rel="stylesheet" href="./src/paper-ui.css"><link rel="stylesheet" href="./src/skill-tree.css"></head>
<body><canvas id="world" aria-label="Трёхмерная магическая башня"></canvas>
<div id="vignette"></div>
<div id="shadow-vfx" aria-hidden="true"></div>

<aside id="intro" class="panel"><h1>Пока солнце<br>не уснуло<span>.</span></h1><button id="start" class="primary">Разбудить свет <span>↗</span></button><button id="reset-progress" class="text-button" title="Обнулить очки и изученные навыки">Сбросить древо навыков · debug</button><button id="sound" class="text-button" aria-label="Включить звук">Звук: выкл. · debug</button></aside>
<section id="hud" hidden><div class="light-stat"><span class="eyebrow">ТВОЙ СВЕТ</span><strong id="light-value">100<small>%</small></strong><div class="light-track"><div id="light-fill"><span class="solar-flow" aria-hidden="true"></span></div><span id="light-sun" aria-hidden="true"></span></div><span id="effect">В свете заката</span></div><div class="objective"><span class="eyebrow">ПУТЬ К КРИСТАЛЛУ</span><strong id="floor">Этаж 12 / 12</strong><div class="progress-track"><div id="progress"></div></div><small id="shards">Блики: 0</small></div></section>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden><div class="modal-card"><div class="eyebrow" id="modal-kicker">ТИШИНА В БАШНЕ</div><h2 id="modal-title">Маленькая пауза</h2><p id="modal-text">Свет подождёт тебя.</p><button class="primary" id="resume">Продолжить <span>↗</span></button><button class="text-button" id="restart">Начать заново</button><button class="text-button" id="main-menu">В главное меню</button></div></div>
<footer><div class="controls"><span><kbd>A</kbd><kbd>D</kbd> / <kbd>←</kbd><kbd>→</kbd> <span id="movement-mode">по спирали</span></span><span id="arena-controls" hidden><kbd>W</kbd><kbd>S</kbd> по арене</span><span><kbd>Пробел</kbd> прыжок</span><span><kbd>Shift</kbd> <span id="phase-status">Phasing</span></span><span id="flare-hint" hidden><kbd>E</kbd> Вспышка</span><span><kbd>Esc</kbd> пауза</span></div><div class="chapter"><span>01</span> ЛОВЕЦ ЗАКАТА <i>✦</i></div></footer>
<div id="touch"><div><button data-key="KeyA" aria-label="Влево">←</button><button data-key="KeyD" aria-label="Вправо">→</button><button data-key="KeyW" class="arena-touch" aria-label="Вперёд" hidden>↑</button><button data-key="KeyS" class="arena-touch" aria-label="Назад" hidden>↓</button></div><div><button id="flare-touch" data-key="KeyE" aria-label="Солнечная вспышка" hidden>☀</button><button data-key="ShiftLeft" aria-label="Phasing">✧</button><button data-key="Space" aria-label="Прыжок">↥</button></div></div>
<script type="module" src="./src/main.js"></script></body></html>
